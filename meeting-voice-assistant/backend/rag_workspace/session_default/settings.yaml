encoding_model: cl100k_base
skip_workflow: false

# LLM 配置
llm:
  description: DashScope LLM
  configuration:
    type: openai_chat
    api_key: ${GRAPHRAG_LLM_API_KEY}
    model: qwen-plus
    api_base: https://dashscope.aliyuncs.com

# 嵌入模型配置
embeddings:
  description: DashScope Embeddings
  configuration:
    type: openai_text
    api_key: ${GRAPHRAG_LLM_API_KEY}
    model: text-embedding-v3
    api_base: https://dashscope.aliyuncs.com

# 存储配置
storage:
  type: file
  path: ./output

# 报告配置
reporting:
  type: file
  path: ./output/reports

# 搜索配置
search:
  type: local
  local:
    mode: local
    vectorizer: embed
    max_tokens: 7500
    temperature: 0.0
