  <rect x="112" y="602" width="1328" height="148" rx="22" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
  <text x="148" y="656" font-size="28" font-weight="800" fill="#1F2937">路径讲解要点</text>
  <text x="148" y="704" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• 桌面 work-cat-v1 通过 idle / thinking / running / success /</text>
<text x="148" y="729" font-size="21" font-weight="500" fill="#374151" text-anchor="start">warning / error / need_input / sleeping 表达状态。</text>
<text x="148" y="756.5" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• Manager/Settings 可预览动作、恢复默认 pack，并通过真实桌面截图留证。</text>
<text x="148" y="809" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• V10 明确 2D-first，不把 provider、3D、签名发布或跨平台能力提前宣称为 ready。</text>
  
</svg>