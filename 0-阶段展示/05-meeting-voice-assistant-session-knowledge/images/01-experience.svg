<text x="126" y="756" font-size="21" font-weight="500" fill="#374151" text-anchor="start">mock，输出转写与语义结构。</text>

  <rect x="632" y="305" width="394" height="390" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="668" y="360" font-size="28" font-weight="800" fill="#0F172A">核心价值</text>
  <text x="668" y="412" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• 前端采集音频，后端通过 ASR adapter</text>
<text x="668" y="437" font-size="21" font-weight="500" fill="#374151" text-anchor="start">支持 DashScope、FunASR 和</text>
<text x="668" y="462" font-size="21" font-weight="500" fill="#374151" text-anchor="start">mock，输出转写与语义结构。</text>
<text x="668" y="464.5" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• 会议应用不再内置知识双引擎，而是通过 Data</text>
<text x="668" y="489.5" font-size="21" font-weight="500" fill="#374151" text-anchor="start">Service MCP</text>
<text x="668" y="514.5" font-size="21" font-weight="500" fill="#374151" text-anchor="start">处理知识固化、GraphRAG、LLMWiki、source</text>
<text x="668" y="517" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• 会议 transcript 归一成</text>
<text x="668" y="542" font-size="21" font-weight="500" fill="#374151" text-anchor="start">workspace/session/source/actor/unit/relation</text>
<text x="668" y="567" font-size="21" font-weight="500" fill="#374151" text-anchor="start">的通用会话知识模型。</text>

