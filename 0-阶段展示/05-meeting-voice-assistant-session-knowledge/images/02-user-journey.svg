  <rect x="112" y="602" width="1328" height="148" rx="22" fill="#F9FAFB" stroke="#CBD5E1" stroke-width="2"/>
  <text x="148" y="656" font-size="28" font-weight="800" fill="#0F172A">路径讲解要点</text>
  <text x="148" y="704" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• 前端采集音频，后端通过 ASR adapter 支持 DashScope、FunASR 和</text>
<text x="148" y="729" font-size="21" font-weight="500" fill="#374151" text-anchor="start">mock，输出转写与语义结构。</text>
<text x="148" y="756.5" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• 会议应用不再内置知识双引擎，而是通过 Data Service MCP</text>
<text x="148" y="781.5" font-size="21" font-weight="500" fill="#374151" text-anchor="start">处理知识固化、GraphRAG、LLMWiki、source trace。</text>
<text x="148" y="809" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• 会议 transcript 归一成</text>
<text x="148" y="834" font-size="21" font-weight="500" fill="#374151" text-anchor="start">workspace/session/source/actor/unit/relation 的通用会话知识模型。</text>
  
</svg>