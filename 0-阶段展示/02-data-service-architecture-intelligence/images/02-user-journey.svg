  <rect x="112" y="602" width="1328" height="148" rx="22" fill="#F9FAFB" stroke="#CBD5E1" stroke-width="2"/>
  <text x="148" y="656" font-size="28" font-weight="800" fill="#0F172A">路径讲解要点</text>
  <text x="148" y="704" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• 把大型项目的代码与文档转为 public surface evidence、关系路径、ranking、human</text>
<text x="148" y="729" font-size="21" font-weight="500" fill="#374151" text-anchor="start">review report 和 context pack。</text>
<text x="148" y="756.5" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• 通过 HTTP / MCP / CLI 暴露同一批架构资产，便于人和 Agent 同时消费。</text>
<text x="148" y="809" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• 明确区分 deterministic evidence、heuristic</text>
<text x="148" y="834" font-size="21" font-weight="500" fill="#374151" text-anchor="start">needs_review、ranking priority 与 acceptance status。</text>
  
</svg>