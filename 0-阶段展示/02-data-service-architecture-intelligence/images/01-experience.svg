  <rect x="632" y="305" width="394" height="390" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="668" y="360" font-size="28" font-weight="800" fill="#0F172A">核心价值</text>
  <text x="668" y="412" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• 把大型项目的代码与文档转为 public</text>
<text x="668" y="437" font-size="21" font-weight="500" fill="#374151" text-anchor="start">surface</text>
<text x="668" y="462" font-size="21" font-weight="500" fill="#374151" text-anchor="start">evidence、关系路径、ranking、human</text>
<text x="668" y="464.5" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• 通过 HTTP / MCP / CLI</text>
<text x="668" y="489.5" font-size="21" font-weight="500" fill="#374151" text-anchor="start">暴露同一批架构资产，便于人和 Agent</text>
<text x="668" y="514.5" font-size="21" font-weight="500" fill="#374151" text-anchor="start">同时消费。</text>
<text x="668" y="517" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• 明确区分 deterministic</text>
<text x="668" y="542" font-size="21" font-weight="500" fill="#374151" text-anchor="start">evidence、heuristic</text>
<text x="668" y="567" font-size="21" font-weight="500" fill="#374151" text-anchor="start">needs_review、ranking</text>

