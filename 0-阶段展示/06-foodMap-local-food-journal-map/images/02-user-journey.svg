  <text x="148" y="704" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• 首屏就是地图，用户通过图钉、照片、评分、到访时间、标签和图层管理私人美食记忆。</text>
<text x="148" y="756.5" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• 纯前端 local-first：IndexedDB、hash route、AMap key path 与</text>
<text x="148" y="781.5" font-size="21" font-weight="500" fill="#374151" text-anchor="start">Leaflet fallback、.foodmap.json 导入导出。</text>
<text x="148" y="809" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• V1.2 增加高德扫街榜推荐层，推荐点保存后才成为个人 FoodPlace。</text>
  
