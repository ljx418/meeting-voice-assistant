  <text x="92" y="104" font-size="40" font-weight="800" fill="#FFFFFF">FoodMap · 用户交互路径</text>
  <text x="92" y="140" font-size="22" font-weight="500" fill="#E5E7EB">一张带照片、评分和回忆的本地私人美食地图。</text>
