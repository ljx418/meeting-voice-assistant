  <text x="148" y="704" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• Chrome 页面内悬浮球作为入口，hover 小长条，点击展开双轨聊天面板，并支持挤压/覆盖/收起。</text>
<text x="148" y="756.5" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• 当前网页上下文进入 Local Runtime，提供摘要、问答、Mermaid mindmap、session</text>
<text x="148" y="781.5" font-size="21" font-weight="500" fill="#374151" text-anchor="start">restore 和 trace。</text>
<text x="148" y="809" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• V1.2 将 ChatBox 拆成 A Page Perception、B Renderer、C</text>
<text x="148" y="834" font-size="21" font-weight="500" fill="#374151" text-anchor="start">Mindmap、D CoreProvider/Adapter、E Integration。</text>
  
