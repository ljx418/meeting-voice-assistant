  <rect x="112" y="602" width="1328" height="148" rx="22" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2"/>
  <text x="148" y="656" font-size="28" font-weight="800" fill="#111827">路径讲解要点</text>
  <text x="148" y="704" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• 用户目标进入 Mission TUI / Workflow Studio，系统生成工作流、Agent</text>
<text x="148" y="729" font-size="21" font-weight="500" fill="#374151" text-anchor="start">分工、diff 和执行计划。</text>
<text x="148" y="756.5" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• 高风险动作通过 approval、policy、capability、rollback、kill switch</text>
<text x="148" y="781.5" font-size="21" font-weight="500" fill="#374151" text-anchor="start">和 evidence chain 受控执行。</text>
<text x="148" y="809" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• Studio 展示 workflow graph、station inspector、Agent</text>
<text x="148" y="834" font-size="21" font-weight="500" fill="#374151" text-anchor="start">profile、产物、diff、rerun 和 review console。</text>
  
