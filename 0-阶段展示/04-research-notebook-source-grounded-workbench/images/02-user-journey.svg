  <rect x="112" y="602" width="1328" height="148" rx="22" fill="#F9FAFB" stroke="#D6D3D1" stroke-width="2"/>
  <text x="148" y="656" font-size="28" font-weight="800" fill="#1F2937">路径讲解要点</text>
  <text x="148" y="704" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• 三列 Notebook 体验：Sources、Chat、Studio，围绕导入、导读、问答和输出组织。</text>
<text x="148" y="756.5" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• 回答、Studio artifact 和 Research report 都必须绑定</text>
<text x="148" y="781.5" font-size="21" font-weight="500" fill="#374151" text-anchor="start">evidence_refs，资料不足时拒答并建议补源。</text>
<text x="148" y="809" font-size="21" font-weight="500" fill="#374151" text-anchor="start">• OCR、Audio、PPT、Mindmap、Document comparison 默认保持</text>
<text x="148" y="834" font-size="21" font-weight="500" fill="#374151" text-anchor="start">provider/decision gate，不能伪装成已 ready。</text>
  
</svg>