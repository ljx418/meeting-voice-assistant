  <text x="92" y="104" font-size="40" font-weight="800" fill="#FFFFFF">ResearchNotebook · 用户交互路径</text>
  <text x="92" y="140" font-size="22" font-weight="500" fill="#E5E7EB">把多来源资料变成可信引用问答、Studio 输出和补源研究报告的笔记工作台。</text>
  <circle cx="1478" cy="98" r="26" fill="#059669"/>
